# Merge every submission that passed its checks, and rebuild the track.
#
# WHY THIS JOB MAY HOLD A WRITE TOKEN when the pull-request check may not: it
# runs on a schedule from `main`, on reviewed code. It never checks out a fork,
# never executes a submitted notebook, and only ever parses JSON. The check that
# DOES see unmerged content from a fork holds nothing at all, and `verify.yml`
# fails the build if anybody adds `pull_request_target`.
name: collect

on:
  schedule:
    # Every half hour. A cohort of 250 hands in through the evening, and a
    # learner who fixed a red check should not wait until tomorrow to see it
    # merge. Cron is UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      merge:
        description: "Actually merge (unchecked = dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Merge what passed, and rebuild the track
        env:
          GH_TOKEN: ${{ github.token }}
          # A scheduled run always merges. A manual run merges only when asked,
          # so it can be used to see what WOULD happen.
          MERGE: ${{ github.event_name == 'schedule' && 'yes' || inputs.merge && 'yes' || '' }}
        run: |
          if [ -n "$MERGE" ]; then
            python3 scripts/collect.py --merge
          else
            python3 scripts/collect.py
          fi

      - name: Commit the track if it changed
        id: track
        run: |
          git config user.name "dev3pack-bot"
          git config user.email "noreply@github.com"
          git add TRACK.md track.json
          if git diff --cached --quiet; then
            echo "the track is unchanged"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            # Read the commit being replaced BEFORE committing: it is what the
            # notification below diffs against to say whose score moved.
            echo "previous=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            git commit -m "track: after the latest merges"
            git push
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # AFTER THE PUSH, NEVER BEFORE. The body names a commit and a raw URL
      # built from it, so announcing an unpushed commit gives the subscriber a
      # URL that 404s.
      #
      # `continue-on-error` is the whole point of this step's design: a
      # subscriber being down is not a reason to make a cohort's merges look
      # broken. The step goes red, the run stays green, and the two failures
      # stay told apart.
      - name: Tell the subscriber the track moved
        if: steps.track.outputs.changed == 'yes'
        continue-on-error: true
        env:
          DEV3PACK_WEBHOOK_URL: ${{ vars.DEV3PACK_WEBHOOK_URL }}
          DEV3PACK_WEBHOOK_SECRET: ${{ secrets.DEV3PACK_WEBHOOK_SECRET }}
        run: |
          python3 scripts/notify.py \
            --previous "${{ steps.track.outputs.previous }}" \
            --commit "${{ steps.track.outputs.commit }}"
